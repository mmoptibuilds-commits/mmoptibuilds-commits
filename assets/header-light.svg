<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mohammed Miran. AI-first builder in Bengaluru, India." fill="none">
<title>Mohammed Miran. AI-first builder in Bengaluru, India.</title>
<style>.spin{animation:spin 48s linear infinite}.spin2{animation:spin 30s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.drift{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(-60px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ece6dc"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="m"><rect width="1200" height="340" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a8480f" stop-opacity="0.14"/><stop offset="1" stop-color="#a8480f" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="#fbfaf8"/>
  <rect width="1200" height="340" fill="url(#dots)" mask="url(#m)"/>
  <g class="drift"><circle cx="980" cy="170" r="260" fill="url(#glow)"/></g>
  <g transform="translate(980 170)">
    <circle r="40" stroke="#7a838d" stroke-opacity="0.85"/><circle r="72" stroke="#7a838d" stroke-opacity="0.73" stroke-dasharray="2 7"/><circle r="104" stroke="#7a838d" stroke-opacity="0.61"/><circle r="136" stroke="#7a838d" stroke-opacity="0.49" stroke-dasharray="2 7"/><circle r="168" stroke="#7a838d" stroke-opacity="0.37"/><circle r="200" stroke="#7a838d" stroke-opacity="0.25" stroke-dasharray="2 7"/>
    <g class="spin"><circle cx="104" cy="0" r="5" fill="#a8480f"/><circle cx="-168" cy="0" r="3.5" fill="#0b6b61"/></g>
    <g class="spin2"><circle cx="0" cy="-136" r="4" fill="#1f2328" fill-opacity="0.8"/><circle cx="0" cy="72" r="3" fill="#a8480f" fill-opacity="0.7"/></g>
    <circle r="9" fill="#a8480f"/><circle r="18" stroke="#a8480f" stroke-opacity="0.45"/>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="19.5" stroke="#e3ddd4"/>
<circle class="pulse" cx="72" cy="78" r="5" fill="#0b6b61"/>
<text x="88" y="83" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="0.5" fill="#545e69">mmoptibuilds &#183; bengaluru, india</text>
<text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2" fill="#1f2328">Mohammed Miran</text>
<text x="66" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#545e69"><tspan fill="#a8480f" font-weight="600">AI-first builder.</tspan> Local-first apps, web products, infrastructure.</text>
<text x="66" y="280" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5e6873">$ ship --verified --accessible --no-fake-claims<tspan class="blink" fill="#a8480f"> &#9608;</tspan></text>

</svg>
